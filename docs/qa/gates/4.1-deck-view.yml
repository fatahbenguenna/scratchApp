status_reason: >-
  Les 10 critères d'acceptation sont implémentés et vérifiés. CI Linux et macOS verte (17 nouveaux
  tests ScratchUITests) ; capture conforme ; contrats intacts. Réserve : un défaut latent apparaîtra
  avec l'hôte audio réel, quand les commandes sont appliquées en différé. START/STOP clignote, et la
  boucle d'affichage peut se suspendre sur un instantané qui précède la commande (#57, P0, avant 6.2).
  Les écarts de l'UX sont suivis dans #58.

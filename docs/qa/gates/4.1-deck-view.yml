top_issues:
  - id: "UI-001"
    severity: high
    finding: >-
      Avec un hôte qui rend le son, tick() ne pompe pas : l'image qui suit send() lit un instantané
      antérieur. apply() écrase motorOn (clignotement de START/STOP), et DisplayLinkDriver.step() se
      suspend dès la première image au repos après wake() : le disque peut rester figé pendant la
      lecture si DisplayWakingEngine est branché. Latent : invisible avec le faux moteur de 4.1.
    refs:
      - "Sources/ScratchUI/Deck/DeckViewModel.swift:119 (apply)"
      - "Sources/ScratchUI/Preview/DisplayLinkDriver.swift (step)"
      - "Sources/ScratchUI/App/AppModel.swift:60"
    suggested_owner: dev
    follow_up: "#57"
  - id: "UX-001"
    severity: low
    finding: >-
      UX à aligner : deck.x.position est absorbé par l'en-tête combiné (§5.10) ; deck.x.emptyImport
      manque à §11.6 ; la marge interne 12 de §9.5 est incompatible avec P = C − 52.
    suggested_owner: ux
    follow_up: "#58"

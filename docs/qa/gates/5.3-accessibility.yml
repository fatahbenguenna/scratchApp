    result: "AccessibilityText source unique ; annonces « chargé », « vidée », SET CUE, START à vide ; pitch 0,1 %, résistance, faders et crossfader 5 %, courbe 10 %, aperçu 5 %."
  - item: "Disque hors de la tabulation"
    result: "Vue AppKit sans premier répondeur ; interaction directe conservée (4.3)."

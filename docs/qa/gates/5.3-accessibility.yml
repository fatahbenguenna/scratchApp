top_issues:
  - id: "TAB-ORDER-IN-DECK"
    severity: low
    finding: "SwiftUI ordonne le focus par la géométrie : le pitch, à droite du disque, passera vraisemblablement avant la rangée de transport, contrairement à l'UX §6.4 et au CA 3 ; l'ordre A → table → B (spec 6.16) est tenu."
    suggested_action: "Relever l'ordre en recette ; décision PO : amender l'UX ou imposer l'ordre (#106)."

    result: "Palette = UX §9.2 ; libellés ≥ 4,5:1, contours ≥ 3:1, variantes de contraste augmenté plus fortes ; recalcul QA : text.secondary 6,88 sur raised, stroke.strong 3,75 et 3,27, danger 5,29, étiquettes 5,69 et 5,54."

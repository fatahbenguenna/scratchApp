status_reason: >-
  Seul le commit propre à la 5.3 a été relu (pile #87/#95 déjà relue). Textes parlés centralisés et
  annonces de l'UX §8.6 ; pas d'ajustement communs aux actions d'accessibilité et aux flèches ; sur Mac,
  commandes réglables focalisables, flèches à la commande focalisée avant les raccourcis, Échap rendant
  les flèches au crossfader (D-07) ; jetons de l'UX §9.2 testés WCAG AA (recalcul QA concordant) et
  contraste augmenté ; écrans de Hugo audités sans écart. Ordre de tabulation dans une platine à
  vérifier en recette et à trancher par le PO (#106). Rebase après #95 (simulé sans conflit).

status_reason: >-
  Le τ appliqué au disque tenu rejoint la valeur visée par une rampe linéaire de 0,12 s/s, calculée
  par échantillon, sans allocation : la crête d'un saut de 100 % à 0 % passe de 16× à 1,32× le geste
  (0,81× au minimum dans l'autre sens, sans inversion). Le rapport ne dépend pas de la vitesse du geste
  (sonde QA). Tests ajoutés : D-48 à 16 × ωref (12,5 τ) et sortie disque tenu indépendante du
  découpage ; le test SF-23 borne désormais le pas avec le τ réellement appliqué.

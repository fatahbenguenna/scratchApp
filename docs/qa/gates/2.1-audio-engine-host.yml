top_issues:
  - id: "LAT-D15"
    severity: medium
    finding: "Latence geste→son au-delà de D-15 : 23,8 ms au premier geste (48 kHz, 256 trames, 120 Hz), 25,2 ms (120 Hz) et 35,8 ms (60 Hz) en régime appris, sans latence du périphérique."
    suggested_action: "Calibrer rejeu, touches prédites ou tampon de 128 trames (17,2 ms en régime appris à 120 Hz) ; à défaut, décision PO (#91)."
  - id: "PROBE-WARM"

    suggested_action: "Geste d'échauffement puis second geste mesuré ; publier les deux valeurs (#92)."
checks:
  - item: "Horloge de secours (D-35, CA 6, CA 9)"
    result: "fallbackClock.stop() (cancel puis queue.sync) en tête de startOutput() ; relance seulement dans le catch après output.stop() ; testSingleRenderThreadDuringSwitch : [false, false]."
  - item: "Un seul fil de rendu"
    result: "RoleGuard du rôle audio du moteur en debug ; isRenderingAudio vrai pendant toute la bascule, sur le fil principal comme AppModel.tick()."
  - item: "AVAudioEngineConfigurationChange"
    result: "Observateur sur l'AVAudioEngine, file principale ; arrêt puis redémarrage, fréquence relue et outputSampleRate renvoyé, moteurs intacts ; pas d'observateur en .unavailable ni d'anti-rebond (2.3)."
  - item: "Tampon de 256 trames (CA 2)"
    result: "macOS : requestBufferFrameSize(256) dans la plage du périphérique, relu après start() ; iOS : durée d'E/S préférée 256/48 000 s, relue."
  - item: "Sonde de latence (CA 11)"
    result: "Partie moteur par le graphe en rendu manuel = rendu direct (10⁻¹²) ; 23,8 ms reproduits par la QA ; borne haute (lecture en fin de tampon)."
  - item: "drainReleasedClips"
    result: "Jamais appelé par l'hôte ; AppModel.tick() l'appelle à chaque image sur le fil principal."
  - item: "Bascule de SelfTest"
    result: "#82 non fusionnée : suivi par #90."

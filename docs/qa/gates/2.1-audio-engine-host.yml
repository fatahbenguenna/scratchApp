status_reason: >-
  Les 11 critères sont implémentés et testés : bloc de rendu conforme aux règles temps réel, horloge de
  secours arrêtée de façon synchrone avant chaque démarrage (un seul fil de rendu), redémarrage sur
  AVAudioEngineConfigurationChange sans toucher aux moteurs, tampon de 256 trames demandé puis relu,
  rendu manuel identique au rendu direct bit à bit. CONCERNS par la règle R2 / D-15 : la première mesure
  (23,8 ms à 120 Hz sans la latence du périphérique) dépasse l'objectif de 20 ms ; en régime appris,
  la QA mesure 25,2 ms à 120 Hz et 35,8 ms à 60 Hz. Fusion possible ; calibrage suivi par #91 et #92.

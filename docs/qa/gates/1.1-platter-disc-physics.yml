    refs: ["docs/stories/1.1.platter-disc-physics.md (tableau des tests)"]
    suggested_owner: sm
    follow_up: "#53"
  - id: "PHY-001"
    severity: low
    finding: >-
      Changement brutal de résistance pendant la tenue : le retard est rattrapé avec le nouveau τ.
      Sur un geste à 2,8 × ωref, 100 % → 0 % donne une vitesse de lecture de 16 pendant 18 ms, et
      100 % → 50 % une vitesse de 4,6 pendant 28 ms. Les pas de 1 % et de 5 % de l'interface sont
      sans effet audible.
    refs: ["Sources/ScratchCore/Physics/DeckPhysics.swift (holdCoefficients dans process)"]
    suggested_owner: dev
    follow_up: "#54"

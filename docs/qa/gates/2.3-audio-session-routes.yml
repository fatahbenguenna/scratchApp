schema: 1
story: "2.3"
story_title: "Session audio et routes"
scope: "Partie 1 (PR #88) : politique pure AudioSystemPolicy et OutputDeviceMonitor (macOS) ; CA 7 et intégration dans l'hôte en partie 2"
pr: 88
issue: 26
reviewed_sha: "07a7d38"
gate: CONCERNS
status_reason: >-
  Gate partielle. Table de politique conforme à l'architecture §7.3, IC-04 et D-04 ; aucune action
  ne démarre un moteur (garanti par le type) ; bandeaux identiques à l'UX §8.5, avis « indisponible »
  à la transition seulement ; rafales Core Audio regroupées. CONCERNS : le contexte ignore l'état
  « interrompu », si bien qu'un routeChanged(true) ou un mediaServicesReset pendant une interruption iOS
  demande un pump() alors que l'horloge de secours rend (deux fils de rendu), et que la sortie peut
  redémarrer en plein appel (#96). Défaut latent, rien n'exécute encore la politique : fusion possible,
  correction exigée avant la partie 2.
reviewer: Quinn
updated: "2026-11-14"
top_issues:
  - id: "POLICY-INTERRUPTED"
    severity: medium
    finding: "Événements reçus pendant une interruption : applyPendingCommands avec l'horloge de secours en marche (routeChanged(true), mediaServicesReset) et startOutput avant interruptionEnded (ces deux-là et configurationChanged)."
    suggested_action: "isInterrupted (ou isFallbackRendering) dans AudioHostContext ; [.stopAllMotors] seul quand l'horloge rend ; aucun startOutput ni nouvel essai avant interruptionEnded ; test sur allEvents (#96)."
  - id: "COALESCING-WINDOW"
    severity: low
    finding: "Regroupement par fenêtre fixe de 50 ms à partir de la première notification : une rafale plus longue donne deux configurationChanged."
    suggested_action: "Délai relancé à chaque notification, fusionné avec AVAudioEngineConfigurationChange en partie 2."
checks:
  - item: "Table de politique (§7.3, IC-04, D-04)"
    result: "Conforme pour chaque ligne ; STOP appliqué (stopOutput, stopAllMotors, pump) avant la nouvelle route ; changement volontaire sur Mac sans STOP, périphérique disparu avec STOP ; suspendu : STOP seulement."
  - item: "Aucun démarrage de moteur"
    result: "AudioHostAction sans cas de démarrage ; testStopRuleIsConsistentAcrossPlatforms."
  - item: "Un seul fil de rendu"
    result: "pump jamais avec isOutputUnavailable (testé) ; lacune pendant une interruption (sonde QA sous Linux, #96)."
  - item: "Bandeaux (UX §8.5)"
    result: "Quatre textes identiques ; pas de répétition à chaque essai manqué ; « retrouvée » avec le nom."
  - item: "Regroupement Core Audio"
    result: "Un seul configurationChanged par rafale rapprochée ; présence du périphérique relue dans l'état courant du HAL."

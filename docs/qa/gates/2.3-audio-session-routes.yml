status_reason: >-
  Partie 2 (#113) : la politique est exécutée dans l'ordre par l'hôte (pump seulement quand rien ne rend,
  horloge de secours arrêtée avant chaque démarrage), nouvel essai de 2 s hors interruption et arrière-plan,
  avis et bandeaux dans l'AppModel, CA 7 ; critères de D-55 tenus (un seul configurationChanged,
  deviceInUse à chaque démarrage, veille synchrone, utilitaire unique, ancienne sortie arrêtée, sortie de
  l'état interrompu par mediaServicesReset et au premier plan). CONCERNS : une interruption « app
  suspendue » (iOS, sans fin) est prise pour une vraie interruption (#121). Partie 1, conservée ci-dessous. Table de politique conforme à l'architecture §7.3, IC-04 et D-04 ; aucune
  action ne démarre un moteur ; bandeaux de l'UX §8.5. Correctif de #96 (D-55) : isInterrupted et
  isFallbackRendering dans AudioHostContext ; pendant une interruption, STOP appliqué par l'horloge de
  secours (jamais de pump), aucun startOutput, nouvel essai ni avis « indisponible » avant
  interruptionEnded ; test sur tous les événements, sortie indisponible ou non. Moniteur : veille
  transmise de façon synchrone, délai de regroupement relancé à chaque notification, test robuste.
  CI verte ; fusion possible selon D-55.

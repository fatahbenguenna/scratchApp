top_issues:
  - id: "IOS-APP-WAS-SUSPENDED"
    severity: medium
    finding: "AudioSessionEvents traduit tout début d'interruption en interruptionBegan : un début « appWasSuspended » (ou wasSuspended), envoyé avec retard et sans fin, laisserait l'hôte interrompu et muet après un retour au premier plan."
    suggested_action: "Ignorer ce début d'interruption (AVAudioSessionInterruptionReasonKey, AVAudioSessionInterruptionWasSuspendedKey), avec un test pur (#121)."
  - id: "ADR-15-NOTICE-TYPES"
    severity: low
    finding: "AudioHostNotice, PostedAudioNotice et AudioNoticePosting sont dans ScratchAudio alors que l'AppModel (Hugo) les utilise (ADR-15 : types partagés dans Contracts/)."
    suggested_action: "Confirmation de Winston."
checks:
  - item: "Table de politique (§7.3, IC-04, D-04)"
    result: "Conforme pour chaque ligne ; STOP appliqué (stopOutput, stopAllMotors, pump) avant la nouvelle route ; changement volontaire sur Mac sans STOP, périphérique disparu avec STOP ; suspendu : STOP seulement."
  - item: "Aucun démarrage de moteur"
    result: "AudioHostAction sans cas de démarrage ; testStopRuleIsConsistentAcrossPlatforms."
  - item: "Un seul fil de rendu"
    result: "pump jamais quand l'horloge de secours rend (isFallbackRendering), y compris pendant une interruption ; testEventsDuringAnInterruption_96 sur tous les événements (#96 corrigé)."
  - item: "Bandeaux (UX §8.5)"
    result: "Quatre textes identiques ; pas de répétition à chaque essai manqué ; « retrouvée » avec le nom."
  - item: "Regroupement Core Audio"
    result: "Délai relancé à chaque notification (compteur de génération), injectable ; testLongBurstGivesASingleEvent (300 ms, écarts de 200 ms, saut si le runner les étire) ; présence du périphérique relue dans l'état courant du HAL."

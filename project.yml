# Projet Xcode généré par XcodeGen (https://github.com/yonaskolb/XcodeGen).
#   brew install xcodegen && xcodegen generate && open ScratchApp.xcodeproj
# Le fichier .xcodeproj n'est pas versionné : project.yml fait foi.
name: ScratchApp
options:
  bundleIdPrefix: app.scratchapp
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  ScratchKit:
    path: .
targets:
  ScratchApp-iOS:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
      - path: App/iOS
    dependencies:
      - package: ScratchKit
        product: ScratchUI
      - package: ScratchKit
        product: ScratchAudio
      - package: ScratchKit
        product: ScratchLibrary
      - package: ScratchKit
        product: ScratchCore
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: ScratchApp
        CFBundleName: ScratchApp
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: false
        UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: ScratchApp
        PRODUCT_BUNDLE_IDENTIFIER: app.scratchapp.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
  ScratchApp-macOS:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
      - path: App/macOS
    dependencies:
      - package: ScratchKit
        product: ScratchUI
      - package: ScratchKit
        product: ScratchAudio
      - package: ScratchKit
        product: ScratchLibrary
      - package: ScratchKit
        product: ScratchCore
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: ScratchApp
        CFBundleName: ScratchApp
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "ScratchApp"
    entitlements:
      path: App/macOS/ScratchApp.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_NAME: ScratchApp
        PRODUCT_BUNDLE_IDENTIFIER: app.scratchapp.mac
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
schemes:
  ScratchApp-iOS:
    build:
      targets:
        ScratchApp-iOS: all
  ScratchApp-macOS:
    build:
      targets:
        ScratchApp-macOS: all

name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # publication des captures d'écran sur une branche ci-shots/*
  pull-requests: write   # commentaire de rapport CI sur la PR
  issues: write

jobs:
  linux:
    name: Linux — ScratchCore & ScratchLibrary
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Aucune API réseau (SF-20, NFR6)
        run: |
          set -o pipefail
          mkdir -p ci-output
          scripts/check-no-network.sh 2>&1 | tee ci-output/no-network.log
      - name: swift build & test
        run: |
          set -o pipefail
          mkdir -p ci-output
          swift test --parallel 2>&1 | tee ci-output/linux-swift-test.log
      - name: Archiver les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-logs
          path: ci-output/
          if-no-files-found: ignore

  macos:
    name: macOS — tests, app macOS, app iOS, self-test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Sélectionner Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Xcode retenu : $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: Tests du package (swift test)
        run: |
          set -o pipefail
          mkdir -p ci-output
          swift test --parallel 2>&1 | tee ci-output/macos-swift-test.log
      - name: Mesures temps réel en release (allocations, charge NFR2 et NFR3)
        run: |
          set -o pipefail
          mkdir -p ci-output
          swift test -c release -Xswiftc -enable-testing --filter 'RenderLoadTests|RealTimeAllocationTests' 2>&1 \
            | tee ci-output/macos-release-tests.log
      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app macOS
        run: |
          set -o pipefail
          xcodebuild -project ScratchApp.xcodeproj -scheme ScratchApp-macOS -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build build 2>&1 \
            | tee ci-output/xcodebuild-macos.log | grep -E "error:|warning: |BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ci-output/xcodebuild-macos.log
      - name: Build app iOS (simulateur)
        run: |
          set -o pipefail
          xcodebuild -project ScratchApp.xcodeproj -scheme ScratchApp-iOS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee ci-output/xcodebuild-ios.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ci-output/xcodebuild-ios.log
      - name: Manifeste de confidentialité dans les apps
        run: |
          set -o pipefail
          for manifest in build/Build/Products/Debug/ScratchApp.app/Contents/Resources/PrivacyInfo.xcprivacy \
                          build/Build/Products/Debug-iphonesimulator/ScratchApp.app/PrivacyInfo.xcprivacy; do
            plutil -lint "$manifest"
            test "$(plutil -extract NSPrivacyTracking raw "$manifest")" = "false"
          done 2>&1 | tee ci-output/privacy-manifest.log
      - name: Self-test audio de l'app macOS
        run: |
          set -o pipefail
          APP="build/Build/Products/Debug/ScratchApp.app"
          "$APP/Contents/MacOS/ScratchApp" --selftest 2>&1 | tee ci-output/selftest.json
      - name: Lancement de l'app et capture d'écran
        run: |
          APP="build/Build/Products/Debug/ScratchApp.app"
          # Scène de la CI (builds Debug seulement) : démo sur A et B, B en lecture (son de 8 s).
          open "$APP" --args --demo-scene
          sleep 6
          screencapture -x ci-output/screenshot.png || true
          # L'app reste lancée : sortie virtuelle du runner, ou horloge de secours sans sortie (D-35).
          sleep 6
          pgrep -x ScratchApp > /dev/null && echo "ScratchApp est en cours d'exécution" | tee ci-output/launch.txt
          pgrep -x ScratchApp > /dev/null
          pkill -x ScratchApp || true
      - name: Publier la capture sur la branche ci-shots
        if: always()
        env:
          SHOT_BRANCH: ci-shots/${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'main' }}
        run: |
          if [ ! -f ci-output/screenshot.png ]; then echo "pas de capture"; exit 0; fi
          TMP=$(mktemp -d)
          cp ci-output/screenshot.png "$TMP/"
          cp ci-output/selftest.json "$TMP/" 2>/dev/null || true
          cd "$TMP"
          git init -q -b shots
          git config user.name "scratchapp-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI screenshot ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "shots:refs/heads/${SHOT_BRANCH}"
      - name: Archiver les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-logs
          path: ci-output/
          if-no-files-found: ignore
      - name: Sauvegarder la fin des journaux pour le rapport
        if: always()
        run: |
          mkdir -p ci-output
          for f in ci-output/*.log ci-output/selftest.json; do
            [ -f "$f" ] || continue
            echo "### $f" >> ci-output/report-tail.md
            echo '```' >> ci-output/report-tail.md
            grep -E "error:|failed|FAILED|Fatal|XCTAssert|✘|passed=false" "$f" | head -40 >> ci-output/report-tail.md || true
            tail -25 "$f" >> ci-output/report-tail.md
            echo '```' >> ci-output/report-tail.md
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-report
          path: ci-output/report-tail.md
          if-no-files-found: ignore

  report:
    name: Rapport CI sur la PR
    if: always() && github.event_name == 'pull_request'
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true
      - name: Commenter la PR
        uses: actions/github-script@v7
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- scratchapp-ci-report -->';
            const icon = r => r === 'success' ? '✅' : (r === 'skipped' ? '⏭️' : '❌');
            let body = `${marker}\n## Rapport CI — ${context.sha.substring(0, 7)}\n\n`;
            body += `| Job | Résultat |\n|---|---|\n`;
            body += `| Linux (aucune API réseau, ScratchCore, ScratchLibrary) | ${icon(process.env.LINUX_RESULT)} ${process.env.LINUX_RESULT} |\n`;
            body += `| macOS (tests, app macOS, app iOS, manifeste de confidentialité, self-test, lancement) | ${icon(process.env.MACOS_RESULT)} ${process.env.MACOS_RESULT} |\n\n`;
            const pr = context.payload.pull_request.number;
            body += `Capture d'écran macOS : branche \`ci-shots/pr-${pr}\`.\n\n`;
            const metrics = 'artifacts/macos-logs/render-metrics.log';
            if (fs.existsSync(metrics)) {
              const lines = fs.readFileSync(metrics, 'utf8').split('\n').filter(l => l.trim()).slice(0, 12);
              body += `**Mesures temps réel (macOS, NFR2 et NFR3)**\n\n${lines.map(l => '- ' + l).join('\n')}\n\n`;
            }
            const tail = 'artifacts/macos-report/report-tail.md';
            if (fs.existsSync(tail)) {
              body += `<details><summary>Extraits des journaux macOS</summary>\n\n${fs.readFileSync(tail, 'utf8').slice(0, 50000)}\n</details>\n`;
            }
            const linuxLog = 'artifacts/linux-logs/linux-swift-test.log';
            if (fs.existsSync(linuxLog) && process.env.LINUX_RESULT !== 'success') {
              const lines = fs.readFileSync(linuxLog, 'utf8').split('\n');
              const errors = lines.filter(l => /error:|failed|FAIL/.test(l)).slice(0, 40).join('\n');
              body += `<details><summary>Extraits du journal Linux</summary>\n\n\`\`\`\n${errors}\n...\n${lines.slice(-30).join('\n')}\n\`\`\`\n</details>\n`;
            }
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
            }
